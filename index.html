<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>!votekickViewer3D</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <nav id="menubar"></nav>
    <div id="viewport"></div>
    <div id="statusbar">
      <span id="status" title="">No model loaded</span>
    </div>

    <div id="drop-hint" hidden>
      <div class="drop-hint-box">Drop model file here</div>
    </div>

    <input type="file" id="file-input" hidden />

    <dialog id="settings-dialog">
      <h2>Settings</h2>
      <label class="setting-row">
        <input type="checkbox" id="set-launch-maximized" />
        <span>Launch maximized window</span>
      </label>
      <h3>Hotkeys</h3>
      <div id="hotkeys-rows"></div>
      <div class="dialog-actions">
        <button id="hotkeys-reset">Reset hotkeys</button>
        <button id="settings-close">Close</button>
      </div>
    </dialog>

    <dialog id="plugins-dialog">
      <h2>Plugins</h2>
      <p>TODO: custom user plugins are planned for a future version.</p>
      <div class="dialog-actions">
        <button id="plugins-close">OK</button>
      </div>
    </dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
